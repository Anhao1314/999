name: FlowCredit CI

# The smallest trustworthy remote regression gate for the frozen baseline:
# structural check + full Node test suite. No model providers, no network
# services, no secrets — the suite is deterministic and offline-friendly.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Print the Node version
        run: node --version
      - name: Structural check
        run: node scripts/check.mjs
      - name: Full test suite
        run: node --test
