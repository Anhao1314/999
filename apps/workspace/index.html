<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e5eefb"><title>公司工作台 · FlowCredit</title><link rel="stylesheet" href="/workspace-assets/ui-tokens.css"><link rel="stylesheet" href="/workspace-assets/styles.css"><link rel="stylesheet" href="/workspace-assets/stage.css"><link rel="stylesheet" href="/workspace-assets/scene-background.css"><link rel="stylesheet" href="/workspace-assets/company-memory.css"><link rel="stylesheet" href="/workspace-assets/company-hiring.css"></head>
<body class="fc-workspace">
<div class="fc-app" id="app" data-connection="CONNECTING" data-nav="workspace">
<aside class="fc-sidebar"><a class="fc-brand" href="/workspace"><span class="fc-mark">F</span><span class="fc-brand-text">FlowCredit<small>Company OS</small></span></a><nav class="fc-nav" id="nav" aria-label="主导航"></nav><div class="fc-side-foot">A company of AI employees,<br>for a more capable you.<span>— FlowCredit</span></div></aside>
<header class="fc-topbar"><span class="fc-top-brand"><span class="fc-brand-image"><img src="/workspace-assets/flowcredit-brand.png" alt=""></span><strong>FlowCredit</strong><small>Company OS</small></span><button id="presentation-toggle" class="fc-presentation-toggle" type="button" aria-pressed="false">演示视图</button><div class="fc-switcher"><label class="fc-sr" for="company">当前公司</label><span class="fc-select-wrap"><select id="company" disabled></select></span></div><button id="new-work" class="fc-btn fc-btn-primary" type="button" disabled>＋ 新建 Work</button><div class="fc-search"><input id="search" type="search" placeholder="搜索已加载内容 · ⌘ K" aria-label="搜索已加载的员工、工作或交付" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false"><div id="search-results" class="fc-search-results" role="listbox" aria-label="搜索结果" hidden></div></div><div class="fc-runtime" id="runtime-status" data-state="CONNECTING"></div><div class="fc-account" title="本机单用户 Runtime" aria-label="Founder 账户：本机单用户 Runtime">F</div></header>
<main class="fc-canvas" id="canvas"><div class="fc-world" id="world"><div class="fc-canvas-content" id="canvas-content"></div></div><div class="fc-controls" id="controls" role="group" aria-label="画布显示控制"><button type="button" data-zoom="out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button type="button" data-zoom="in" aria-label="放大">＋</button><span class="fc-controls-divider" aria-hidden="true"></span><button type="button" data-zoom="fit">适应</button><button type="button" data-zoom="reset">重置视图</button></div><section class="fc-attention" id="attention-panel" role="dialog" aria-modal="false" aria-label="需要你处理" hidden></section></main>
<aside class="fc-board-layer" id="board-layer" aria-label="可移动的公司卡片" hidden></aside><div class="fc-sr" id="board-status" role="status" aria-live="polite"></div>
<button class="fc-assistant-pet" id="assistant-pet" type="button" aria-controls="assistant-bubble" aria-expanded="false" title="单击查看助理简报；双击查看员工详情" hidden><span class="fc-assistant-sprite" aria-hidden="true"></span><span class="fc-assistant-label"><strong id="assistant-name"></strong><small id="assistant-role"></small></span><span class="fc-assistant-signal" aria-hidden="true"></span></button>
</div>
<section class="fc-assistant-bubble" id="assistant-bubble" role="dialog" aria-modal="false" aria-labelledby="assistant-bubble-title" hidden><header><div><span class="fc-eyebrow">创始人直属</span><h2 id="assistant-bubble-title"></h2></div><button type="button" id="assistant-bubble-close" aria-label="关闭助理简报">×</button></header><div id="assistant-bubble-body"></div><footer><button type="button" id="assistant-employee-detail" class="fc-link-btn">查看员工详情 ↗</button><button type="button" id="assistant-work-page" class="fc-link-btn">查看工作 ↗</button></footer></section>
<section class="fc-board-summary" id="board-summary" role="dialog" aria-modal="false" aria-labelledby="board-summary-title" hidden><header><h2 id="board-summary-title"></h2><button type="button" id="board-summary-close" aria-label="关闭简要介绍">×</button></header><div id="board-summary-body"></div><button type="button" id="board-summary-detail" class="fc-link-btn">打开详情</button></section>
<dialog class="fc-board-detail" id="board-detail" aria-labelledby="board-detail-title"><header><div><span class="fc-eyebrow">公司近况</span><h2 id="board-detail-title"></h2></div><button type="button" id="board-detail-close" aria-label="关闭子页面">×</button></header><div class="fc-board-detail-body" id="board-detail-body"></div></dialog>
<dialog class="fc-inspector" id="inspector" aria-label="详情"><header class="fc-inspector-top"><span class="fc-eyebrow">详情</span><button type="button" id="inspector-close" aria-label="关闭详情">×</button></header><div class="fc-inspector-body" id="inspector-body"></div></dialog>
<dialog class="fc-page-popover" id="page-popover" aria-labelledby="page-popover-title" data-size="compact"><span class="fc-page-popover-anchor" id="page-popover-anchor" aria-hidden="true"></span><header class="fc-page-popover-head"><span class="fc-page-popover-mark" id="page-popover-mark" aria-hidden="true">F</span><div><span class="fc-page-popover-kicker">FlowCredit</span><h2 id="page-popover-title"></h2></div><button type="button" id="page-popover-close" aria-label="关闭子页面">×</button></header><div class="fc-page-popover-content" id="page-popover-content"></div><iframe id="page-popover-frame" title="AI 员工" hidden></iframe></dialog>
<script type="module" src="/workspace-assets/app.mjs"></script>
<script type="module" src="/workspace-assets/scene-background.mjs"></script>
</body></html>
